# Flatpak bundles for a release. Push a tag (v0.7.0-beta, ...) and this builds
# chatot-x86_64.flatpak and chatot-aarch64.flatpak on GitHub's runners and
# attaches them to a GitHub Release for that tag. Nothing is built or stored
# locally. "Run workflow" on the Actions page builds the current branch and
# keeps the bundles as workflow artifacts, without a release.
name: Flatpak

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/flatpak/com.sezdm.chatot.yml
          bundle: chatot-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ hashFiles('build-aux/flatpak/com.sezdm.chatot.yml', 'build-aux/flatpak/go.mod.yml') }}
          artifact-name: chatot-${{ matrix.arch }}

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.flatpak
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true
